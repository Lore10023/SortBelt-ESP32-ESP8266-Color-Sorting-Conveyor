<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f1f5f9;stroke:#334155;stroke-width:2}
    .t{font-size:14px;font-weight:bold;fill:#0f172a;text-anchor:middle}
    .l{font-size:12px;fill:#0f172a}
    .r{font-size:12px;fill:#0f172a;text-anchor:end}
    .s{font-size:11px;fill:#64748b}
    .n{font-size:12.5px;fill:#1e293b}
    .w{fill:none;stroke-width:2.5;stroke-linejoin:round}
    .sig{stroke:#2563eb}
    .pwr{stroke:#dc2626}
    .gnd{stroke:#1f2937}
    .mot{stroke:#16a34a}
    .pin{fill:#0f172a}
  </style>

  <rect width="1200" height="810" fill="#ffffff"/>
  <text x="30" y="34" font-size="22" font-weight="bold" fill="#0f172a">SortBelt – Wiring diagram</text>

  <!-- ================= SENSOR NODE ================= -->
  <text class="t" x="130" y="67">TCS3200 color sensor</text>
  <rect class="box" x="30" y="75" width="200" height="230" rx="8"/>
  <text class="r" x="220" y="124">S2</text>
  <text class="r" x="220" y="154">S3</text>
  <text class="r" x="220" y="184">OUT</text>
  <text class="r" x="220" y="214">VCC</text>
  <text class="r" x="220" y="244">GND</text>
  <text class="s" x="42" y="280">S0 / S1: hard-wired (see notes)</text>

  <text class="t" x="430" y="67">ESP8266 – Sensor node</text>
  <rect class="box" x="330" y="75" width="200" height="230" rx="8"/>
  <text class="l" x="342" y="124">GPIO12 (D6)</text>
  <text class="l" x="342" y="154">GPIO14 (D5)</text>
  <text class="l" x="342" y="184">GPIO13 (D7)</text>
  <text class="l" x="342" y="214">3V3</text>
  <text class="l" x="342" y="244">GND</text>

  <path class="w sig" d="M230,120 H330"/>
  <path class="w sig" d="M230,150 H330"/>
  <path class="w sig" d="M230,180 H330"/>
  <path class="w pwr" d="M230,210 H330"/>
  <path class="w gnd" d="M230,240 H330"/>

  <!-- ESP-NOW link -->
  <path d="M430,308 V424" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arr)"/>
  <text x="446" y="372" font-size="13" font-weight="bold" fill="#7c3aed">ESP-NOW wireless link</text>
  <text x="446" y="389" font-size="12" fill="#7c3aed">2.4 GHz, channel 1</text>

  <!-- ================= CONTROLLER ================= -->
  <text class="t" x="430" y="442" dy="-0">ESP32 DevKit – Controller</text>
  <rect class="box" x="330" y="450" width="200" height="330" rx="8"/>
  <text class="l" x="342" y="524">GPIO18</text>
  <text class="l" x="342" y="594">GPIO27</text>
  <text class="l" x="342" y="694">3V3</text>
  <text class="l" x="342" y="744">GND</text>
  <text class="r" x="518" y="524">GPIO26</text>
  <text class="r" x="518" y="574">GPIO25</text>
  <text class="r" x="518" y="624">GPIO33</text>
  <text class="r" x="518" y="744">GND</text>

  <!-- Servo -->
  <text class="t" x="115" y="487">Servo (diverter)</text>
  <rect class="box" x="30" y="495" width="170" height="80" rx="8"/>
  <text class="r" x="190" y="524">SIG</text>
  <text class="r" x="190" y="549">V+</text>
  <text class="r" x="190" y="569">GND</text>
  <path class="w sig" d="M200,520 H330"/>
  <path class="w pwr" d="M200,545 H245"/>
  <path class="w gnd" d="M200,565 H245"/>
  <text class="s" x="250" y="549">ext. 5 V</text>
  <text class="s" x="250" y="569">common GND</text>

  <!-- IR sensor -->
  <text class="t" x="115" y="603">IR obstacle sensor</text>
  <rect class="box" x="30" y="610" width="170" height="100" rx="8"/>
  <text class="r" x="190" y="639">OUT</text>
  <text class="r" x="190" y="669">VCC</text>
  <text class="r" x="190" y="694">GND</text>
  <text class="s" x="42" y="639">active LOW</text>
  <path class="w sig" d="M200,635 H270 V590 H330"/>
  <path class="w pwr" d="M200,665 H290 V690 H330"/>
  <path class="w gnd" d="M200,690 H250 V740 H330"/>

  <!-- ================= MOTOR DRIVER ================= -->
  <text class="t" x="800" y="442">L298N motor driver</text>
  <rect class="box" x="700" y="450" width="200" height="330" rx="8"/>
  <text class="l" x="712" y="524">IN1</text>
  <text class="l" x="712" y="574">IN2</text>
  <text class="l" x="712" y="624">ENA (PWM)</text>
  <text class="l" x="712" y="744">GND</text>
  <text class="r" x="888" y="524">OUT1</text>
  <text class="r" x="888" y="574">OUT2</text>
  <text class="r" x="888" y="694">+12V (VS)</text>
  <text class="r" x="888" y="744">GND</text>

  <path class="w sig" d="M530,520 H700"/>
  <path class="w sig" d="M530,570 H700"/>
  <path class="w sig" d="M530,620 H700"/>
  <path class="w gnd" d="M530,740 H700"/>

  <!-- Motor -->
  <text class="t" x="1085" y="487">DC gear motor</text>
  <rect class="box" x="1010" y="495" width="150" height="100" rx="8"/>
  <text class="l" x="1022" y="524">M+</text>
  <text class="l" x="1022" y="574">M−</text>
  <path class="w mot" d="M900,520 H1010"/>
  <path class="w mot" d="M900,570 H1010"/>

  <!-- Supply -->
  <text class="t" x="1085" y="647">Motor supply</text>
  <rect class="box" x="1010" y="655" width="150" height="110" rx="8"/>
  <text class="l" x="1022" y="694">+</text>
  <text class="l" x="1022" y="744">−</text>
  <text class="s" x="1022" y="758" opacity="0">.</text>
  <path class="w pwr" d="M900,690 H1010"/>
  <path class="w gnd" d="M900,740 H1010"/>

  <!-- Pin dots -->
  <g class="pin">
    <circle cx="230" cy="120" r="4"/><circle cx="230" cy="150" r="4"/><circle cx="230" cy="180" r="4"/><circle cx="230" cy="210" r="4"/><circle cx="230" cy="240" r="4"/>
    <circle cx="330" cy="120" r="4"/><circle cx="330" cy="150" r="4"/><circle cx="330" cy="180" r="4"/><circle cx="330" cy="210" r="4"/><circle cx="330" cy="240" r="4"/>
    <circle cx="200" cy="520" r="4"/><circle cx="200" cy="545" r="4"/><circle cx="200" cy="565" r="4"/>
    <circle cx="200" cy="635" r="4"/><circle cx="200" cy="665" r="4"/><circle cx="200" cy="690" r="4"/>
    <circle cx="330" cy="520" r="4"/><circle cx="330" cy="590" r="4"/><circle cx="330" cy="690" r="4"/><circle cx="330" cy="740" r="4"/>
    <circle cx="530" cy="520" r="4"/><circle cx="530" cy="570" r="4"/><circle cx="530" cy="620" r="4"/><circle cx="530" cy="740" r="4"/>
    <circle cx="700" cy="520" r="4"/><circle cx="700" cy="570" r="4"/><circle cx="700" cy="620" r="4"/><circle cx="700" cy="740" r="4"/>
    <circle cx="900" cy="520" r="4"/><circle cx="900" cy="570" r="4"/><circle cx="900" cy="690" r="4"/><circle cx="900" cy="740" r="4"/>
    <circle cx="1010" cy="520" r="4"/><circle cx="1010" cy="570" r="4"/><circle cx="1010" cy="690" r="4"/><circle cx="1010" cy="740" r="4"/>
  </g>

  <!-- ================= LEGEND + NOTES ================= -->
  <rect x="700" y="75" width="470" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="718" y="102" font-size="14" font-weight="bold" fill="#0f172a">Legend</text>
  <path class="w sig" d="M718,122 H760"/><text class="n" x="772" y="126">Signal</text>
  <path class="w pwr" d="M718,144 H760"/><text class="n" x="772" y="148">Power (3.3 V / 5 V / motor supply)</text>
  <path class="w gnd" d="M718,166 H760"/><text class="n" x="772" y="170">Ground</text>
  <path class="w mot" d="M718,188 H760"/><text class="n" x="772" y="192">Motor output</text>
  <path d="M718,210 H760" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/><text class="n" x="772" y="214">Wireless (ESP-NOW)</text>

  <text x="718" y="246" font-size="14" font-weight="bold" fill="#0f172a">Notes</text>
  <text class="n" x="718" y="270">1. Connect all grounds together (ESP32, L298N, supply, sensors).</text>
  <text class="n" x="718" y="292">2. Remove the ENA jumper on the L298N so PWM controls the speed.</text>
  <text class="n" x="718" y="314">3. Power the servo from a separate 5 V source and share GND.</text>
  <text class="n" x="718" y="336">4. The IR sensor runs from 3.3 V so its OUT is safe for the ESP32.</text>
  <text class="n" x="718" y="358">5. S0/S1 on the TCS3200 are not driven by the code: hard-wire</text>
  <text class="n" x="734" y="376">them to the same levels you used when calibrating.</text>
  <text class="n" x="718" y="398">6. Power each board over USB or a regulated 5 V supply.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
